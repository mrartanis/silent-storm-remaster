name: Desktop launcher

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['launcher-check/**']

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            launcher
            packaging

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                       -o Dir::Etc::sourceparts=- -o Acquire::Retries=1
                       -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y \
            --no-install-recommends libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxkbcommon-x11-0 weston xvfb

      - name: Build launcher
        run: |
          case "$TARGET" in
            macos-arm64) test "$(uname -m)" = arm64 ;;
            *) test "$(uname -m)" = x86_64 ;;
          esac
          python -m pip install -r launcher/requirements-build.txt
          QT_QPA_PLATFORM=offscreen python -m unittest discover -s launcher -p 'test_*.py'
          python -m PyInstaller --noconfirm launcher/launcher.spec

      - name: Archive and launch from a clean directory
        env:
          S2_LAUNCHER_SMOKE_TOKEN: ${{ github.token }}
        run: |
          archive="silent-storm-launcher-$TARGET"
          mkdir -p artifacts smoke
          case "$TARGET" in
            windows-x64)
              (cd dist && python -m zipfile -c "../artifacts/$archive.zip" SilentStormLauncher)
              python -m zipfile -e "artifacts/$archive.zip" smoke
              command=(./smoke/SilentStormLauncher/SilentStormLauncher.exe)
              ;;
            linux-x64)
              tar -C dist -czf "artifacts/$archive.tar.gz" SilentStormLauncher
              tar -C smoke -xzf "artifacts/$archive.tar.gz"
              command=(xvfb-run -a env QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1
                       ./smoke/SilentStormLauncher/SilentStormLauncher)
              ;;
            macos-arm64)
              ditto -c -k --sequesterRsrc --keepParent dist/SilentStormLauncher.app "artifacts/$archive.zip"
              ditto -x -k "artifacts/$archive.zip" smoke
              command=(env PATH=/usr/bin:/bin:/usr/sbin:/sbin
                       ./smoke/SilentStormLauncher.app/Contents/MacOS/SilentStormLauncher)
              ;;
          esac
          status=0
          "${command[@]}" --smoke-test smoke/result.log || status=$?
          if [[ -f smoke/result.log ]]; then cat smoke/result.log; fi
          test "$status" = 0
          grep -q '^Installed and verified the local engine fixture' smoke/result.log
          if [[ "$TARGET" == linux-x64 ]]; then grep -q '(xcb)' smoke/result.log; fi

      - name: Launch natively on Wayland
        if: runner.os == 'Linux'
        env:
          S2_LAUNCHER_SMOKE_TOKEN: ${{ github.token }}
        run: |
          unset DISPLAY
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=launcher-wayland XDG_SESSION_TYPE=wayland QT_QPA_PLATFORM=wayland
          weston --backend=headless-backend.so --use-pixman --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 > smoke/weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; wait "$compositor" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            kill -0 "$compositor" 2>/dev/null || break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then cat smoke/weston.log; exit 1; fi
          status=0
          QT_DEBUG_PLUGINS=1 ./smoke/SilentStormLauncher/SilentStormLauncher \
            --smoke-test smoke/wayland.log || status=$?
          if [[ -f smoke/wayland.log ]]; then cat smoke/wayland.log; fi
          test "$status" = 0
          grep -q '(wayland)' smoke/wayland.log
          grep -q '^Installed and verified the local engine fixture' smoke/wayland.log

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-package-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-smoke-${{ matrix.target }}
          path: smoke/*.log
          if-no-files-found: ignore
