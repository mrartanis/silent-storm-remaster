name: Engine CI and release

on:
  push:
    branches: [develop, android]
    tags: ['v*']
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (manual runs never publish)
        type: choice
        options: [all, windows, linux, macos, android]
        default: all

permissions:
  contents: read

concurrency:
  # New PR/branch commits replace stale checks; tagged releases finish intact.
  # Manual checks of different platforms can run independently.
  group: engine-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    if: inputs.platform != 'android' && !(github.event_name == 'push' && github.ref == 'refs/heads/android')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-2022","platform":"windows","arch":"x64"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]' || inputs.platform == 'macos' && '[{"os":"macos-15","platform":"macos","arch":"arm64"}]' || '[{"os":"windows-2022","platform":"windows","arch":"x64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"},{"os":"macos-15","platform":"macos","arch":"arm64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      S2_BUILD_JOBS: ${{ matrix.platform == 'macos' && '2' || '4' }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Do not download the multi-gigabyte HD authoring tree.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/terrain-hd/
            !/data/hd-sources/
            !/data/hd-runtime/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set dependency directory
        run: |
          echo "S2_DEPS=$RUNNER_TEMP/s2-release-deps" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/s2-ccache" >> "$GITHUB_ENV"

      - name: Select MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build pkg-config ccache \
            libgsf-1-dev libpng-dev zlib1g-dev libx11-dev libxext-dev libxi-dev \
            libxrandr-dev libxfixes-dev libxcursor-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libvulkan-dev mesa-vulkan-drivers xvfb openbox x11-utils

      - name: Cache pinned dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.S2_DEPS }}
          key: engine-deps-${{ matrix.os }}-${{ hashFiles('.github/scripts/prepare-deps.py', '.github/scripts/build-deps.sh') }}
          restore-keys: engine-deps-${{ matrix.os }}-

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ninja pkg-config libgsf libpng ccache

      - name: Restore compiler cache
        if: runner.os != 'Windows'
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: compiler-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: compiler-${{ matrix.os }}-

      - name: Fetch pinned sources
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python .github/scripts/prepare-deps.py --root "$S2_DEPS" --platform '${{ matrix.platform }}'

      - name: Prepare MSYS build tools
        if: runner.os == 'Windows' && steps.dependencies.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils

      - name: Build Windows FFmpeg shared libraries
        if: runner.os == 'Windows' && steps.dependencies.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/scripts/build-deps.sh "$S2_DEPS" windows

      - name: Build Unix SDL3 and FFmpeg shared libraries
        if: runner.os != 'Windows' && steps.dependencies.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-deps.sh "$S2_DEPS" '${{ matrix.platform }}'

      - name: Save completed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.S2_DEPS }}
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Configure Windows engine with native audio and video
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DSDL3_DIR=$env:S2_DEPS/SDL3-3.4.16/cmake" `
            "-DS2_BGFX_CMAKE_ROOT=$env:S2_DEPS/bgfx.cmake" `
            "-DS2_BGFX_DIR=$env:S2_DEPS/bgfx" `
            "-DS2_BIMG_DIR=$env:S2_DEPS/bimg" "-DS2_BX_DIR=$env:S2_DEPS/bx" `
            "-DS2_FFMPEG_ROOT=$env:S2_DEPS/install" "-DS2_MINIAUDIO_INCLUDE_DIR=$env:S2_DEPS" `
            -DS2_BUILD_MEDIA_PROBE=ON -DS2_BUILD_MINIAUDIO_MUSIC_PROBE=ON `
            -DS2_ENABLE_NATIVE_MUSIC=ON -DS2_ENABLE_NATIVE_SFX=ON -DS2_ENABLE_NATIVE_VIDEO=ON `
            -DS2_BUILD_HD_TEXTURES=OFF

      - name: Configure Linux game
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DS2_BUILD_GAME=ON -DSDL3_DIR="$S2_DEPS/install/lib/cmake/SDL3" \
            -DS2_BGFX_CMAKE_ROOT="$S2_DEPS/bgfx.cmake" -DS2_BGFX_DIR="$S2_DEPS/bgfx" \
            -DS2_BIMG_DIR="$S2_DEPS/bimg" -DS2_BX_DIR="$S2_DEPS/bx" \
            -DS2_BUILD_MEDIA_PROBE=ON -DS2_BUILD_MINIAUDIO_MUSIC_PROBE=ON \
            -DS2_FFMPEG_ROOT="$S2_DEPS/install" -DS2_MINIAUDIO_INCLUDE_DIR="$S2_DEPS" \
            -DBGFX_WITH_WAYLAND=OFF -DS2_BUILD_HD_TEXTURES=OFF

      - name: Configure macOS game
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DS2_BUILD_GAME=ON -DSDL3_DIR="$S2_DEPS/install/lib/cmake/SDL3" \
            -DS2_BGFX_CMAKE_ROOT="$S2_DEPS/bgfx.cmake" -DS2_BGFX_DIR="$S2_DEPS/bgfx" \
            -DS2_BIMG_DIR="$S2_DEPS/bimg" -DS2_BX_DIR="$S2_DEPS/bx" \
            -DS2_BUILD_MEDIA_PROBE=ON -DS2_BUILD_MINIAUDIO_MUSIC_PROBE=ON \
            -DS2_FFMPEG_ROOT="$S2_DEPS/install" -DS2_MINIAUDIO_INCLUDE_DIR="$S2_DEPS" \
            -DS2_BUILD_HD_TEXTURES=OFF

      - name: Build engine and tests
        id: engine-build
        run: cmake --build build --config Release --parallel "$S2_BUILD_JOBS"

      - name: Verify engine packaging
        run: |
          python diagnostics/EnginePackageTests.py
          python diagnostics/MacOSRuntimeTests.py

      - name: Test Windows engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD/build/Release;$PWD/build/_implibs;$PWD/build/_media/Release;$env:S2_DEPS/install/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --timeout 120 --parallel 1

      - name: Test Linux engine with software Vulkan
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="$S2_DEPS/install/lib"
          export SDL_AUDIODRIVER=dummy
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/s2-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          bash .github/scripts/test-linux.sh build

      - name: Test macOS engine
        if: runner.os == 'macOS'
        env:
          S2_AUDIO_HEADLESS: '1'
        run: |
          # Cocoa window tests share desktop focus and must run sequentially.
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --timeout 300 --parallel 1

      - name: Package Windows engine
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('check-{0}', github.run_number) }}
        run: |
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT" -Directory | Select-Object -First 1
          if (-not $crt) { throw 'MSVC x64 redistributable runtime not found' }
          python diagnostics/Package-Engine.py --platform windows --build build/Release `
            --deps "$env:S2_DEPS" --crt-runtime "$($crt.FullName)" `
            --version "$env:RELEASE_VERSION" --output dist

      - name: Package Linux engine
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('check-{0}', github.run_number) }}
        run: |
          python diagnostics/Package-Engine.py --platform linux --build build \
            --deps "$S2_DEPS" --version "$RELEASE_VERSION" --output dist

      - name: Package macOS engine and verify relocated startup
        # Packaging diagnostics are independent of a CTest failure. Publication
        # still requires the entire build job (including CTest) to succeed.
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.engine-build.outcome == 'success' }}
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('check-{0}', github.run_number) }}
        run: |
          python diagnostics/Package-Engine.py --platform macos --build build \
            --deps "$S2_DEPS" --version "$RELEASE_VERSION" --output dist

      - name: Save engine archive
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}-${{ matrix.arch }}-archive
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}-logs
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.S2_DEPS }}/ffmpeg-build/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save compiler cache, including after test failures
        if: always() && runner.os != 'Windows' && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  android:
    name: Android ARM64 package and emulator
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      S2_BUILD_JOBS: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/terrain-hd/
            !/data/hd-sources/
            !/data/hd-runtime/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Android and host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive automake build-essential ccache cmake curl \
            gettext libtool libtool-bin libgl1-mesa-dev libx11-dev libxext-dev libxi-dev \
            ninja-build pkg-config xz-utils
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.31.6' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "S2_DEPS=$RUNNER_TEMP/s2-android-deps" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/s2-android-ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Cache pinned Android dependencies
        id: android-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.S2_DEPS }}/android-arm64
            ${{ env.S2_DEPS }}/android-notices
            ${{ env.S2_DEPS }}/bgfx.cmake
            ${{ env.S2_DEPS }}/bgfx
            ${{ env.S2_DEPS }}/bimg
            ${{ env.S2_DEPS }}/bx
            ${{ env.S2_DEPS }}/SDL3-3.4.16
            ${{ env.S2_DEPS }}/freetype-2.14.3
            ${{ env.S2_DEPS }}/miniaudio.h
            ${{ env.S2_DEPS }}/shaderc
          key: android-deps-${{ runner.os }}-ndk28c-${{ hashFiles('.github/scripts/prepare-deps.py', '.github/scripts/build-android-deps.sh') }}

      - name: Build pinned Android dependencies and host shader compiler
        if: steps.android-deps.outputs.cache-hit != 'true'
        run: |
          python .github/scripts/prepare-deps.py --root "$S2_DEPS" --platform linux
          bash .github/scripts/build-android-deps.sh "$S2_DEPS"

      - name: Restore compiler cache
        id: android-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-compiler-ndk28c-${{ github.run_id }}
          restore-keys: android-compiler-ndk28c-

      - name: Test touch gestures on the host
        run: |
          c++ -std=c++17 diagnostics/TouchGestureTests.cpp -o "$RUNNER_TEMP/touch-tests"
          "$RUNNER_TEMP/touch-tests"

      - name: Build the Android release APK and the emulator probe
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('check-{0}', github.run_number) }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle="$S2_DEPS/SDL3-3.4.16/android-project/gradlew"
          bash "$gradle" -p android --max-workers "$S2_BUILD_JOBS" -Ps2Deps="$S2_DEPS" \
            -Ps2Game -Ps2Shaderc="$S2_DEPS/shaderc" -Ps2Freetype="$S2_DEPS/freetype-2.14.3" \
            -Ps2VersionName="$RELEASE_VERSION" -Ps2VersionCode="$((VERSION_CODE + 1))" assembleRelease
          bash "$gradle" -p android --max-workers "$S2_BUILD_JOBS" -Ps2Deps="$S2_DEPS" \
            -Ps2Abi=x86_64 assembleDebug

      - name: Verify Android lifecycle, Vulkan presentation and touch in the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          export ANDROID_SERIAL=emulator-5554
          printf 'no\n' | avdmanager create avd --name silent-storm-ci --force \
            --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd silent-storm-ci -port 5554 -no-window \
            -gpu swiftshader -accel on -no-snapshot -no-audio -no-boot-anim -camera-back none \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb logcat -d > "$RUNNER_TEMP/android-logcat.txt" || true
            adb emu kill || kill "$emulator_pid" || true
          }
          trap cleanup EXIT
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell wm dismiss-keyguard
          adb shell svc power stayon true
          python .github/scripts/test-android.py android/build/outputs/apk/debug/SilentStormAndroid-debug.apk

      - name: Sign and verify the Android APK
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('check-{0}', github.run_number) }}
          ANDROID_REQUIRE_RELEASE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          ANDROID_RELEASE_KEYSTORE: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_RELEASE_KEYSTORE || '' }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || '' }}
        run: |
          apk="dist/silent-storm-engine-$RELEASE_VERSION-android-arm64.apk"
          bash .github/scripts/package-android.sh android/build/outputs/apk/release/SilentStormAndroid-release-unsigned.apk "$apk"
          python diagnostics/AndroidPackageTests.py --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --version "$RELEASE_VERSION" "$apk"

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-android-arm64-archive
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-android-arm64-logs
          path: |
            ${{ runner.temp }}/android-emulator.log
            ${{ runner.temp }}/android-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save compiler cache
        if: always() && steps.android-compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.android-compiler-cache.outputs.cache-primary-key }}

  publish:
    name: Publish tagged engine release
    needs: [build, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*-archive
          merge-multiple: true
          path: dist

      - name: Verify and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          for asset in "silent-storm-engine-$RELEASE_TAG-windows-x64.zip" \
                       "silent-storm-engine-$RELEASE_TAG-linux-x64.tar.gz" \
                       "silent-storm-engine-$RELEASE_TAG-macos-arm64.tar.gz" \
                       "silent-storm-engine-$RELEASE_TAG-android-arm64.apk"; do
            test -s "$asset"
            test -s "$asset.sha256"
          done
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm ./*.sha256
          cat > release-notes.txt <<'NOTES'
          ## Русский
          Движок для Windows x64, Linux x64 (Ubuntu 24.04), macOS ARM64 (Apple silicon, macOS 15+) и Android ARM64 (Android 9+ с Vulkan).
          Нужны данные оригинальной Silent Storm 1.2 из вашей копии игры. Для ПК доступен отдельный HD-пак. Android использует оригинальные текстуры.
          macOS запускается через Play.command. Для Android скачайте APK и перенесите ресурсы по инструкции ниже.

          ## English
          Engine builds for Windows x64, Linux x64 (Ubuntu 24.04), macOS ARM64 (Apple silicon, macOS 15+), and Android ARM64 (Android 9+ with Vulkan).
          Use the original Silent Storm 1.2 data from your own copy. The separate HD pack is available for desktop. Android uses the original textures.
          Start macOS with Play.command. For Android, install the APK and copy the game files using the guide below.
          NOTES
          for guide in 'ПК (русский)|INSTALLATION_RU.md' 'Desktop (English)|INSTALLATION_EN.md' \
                       'Android (русский)|android/README.md' 'Android (English)|android/README.en.md' \
                       'Компоненты Android / Android components|android/THIRD_PARTY.md'; do
            printf '\n- [%s](https://github.com/%s/blob/%s/%s)\n' "${guide%%|*}" "$GH_REPO" "$RELEASE_TAG" "${guide#*|}" >> release-notes.txt
          done
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          # Stage uploads as a draft; publish only after every asset is present.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-draft.txt 2>/dev/null; then
            if [[ "$(cat existing-draft.txt)" != true ]]; then
              echo 'A published release already exists; refusing to replace its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file release-notes.txt "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.apk SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${options[@]}"
